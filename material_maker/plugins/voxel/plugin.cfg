[plugin]

name="Voxel materials"
description="Adds the Voxel Material node (a material type for per-object voxel and 3D-placed materials: object-space position, normal and bump in the 3D preview) and the Voxel Inputs node (sliders for seed, age, upkeep, fresh, char, wet, axis, origin and footprint, and the object-space position and normal). Export targets for game engines are added by this plugin's export_targets folder."
version="1.0"
nodes="nodes"
library="library.json"
export_targets="export_targets"
enabled_by_default=true
