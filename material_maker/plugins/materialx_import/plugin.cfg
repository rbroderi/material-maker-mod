[plugin]

name="MaterialX import"
description="Imports MaterialX materials (.mtlx: standard_surface, open_pbr_surface, UsdPreviewSurface and gltf_pbr, with their images) as Material Maker graphs. Adds the .mtlx format to File/Load (and drag and drop), File/Import MaterialX material... and the materialx_import command (material_maker --plugin materialx_import <file.mtlx> [output.ptex])."
version="1.0"
script="plugin.gd"
enabled_by_default=true
