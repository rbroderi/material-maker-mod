[plugin]

name="AxF import"
description="Imports X-Rite AxF materials (SVBRDF, car paints and BTF) as Material Maker graphs, with python/axf2ptex.py. Needs Python 3 with numpy and h5py (pip install numpy h5py); set the MATERIAL_MAKER_PYTHON environment variable to use a specific Python. Adds Plugins/Import AxF material..., the axf_import command (material_maker --plugin axf_import <file.axf> [output directory]) and the import_axf RPC method."
version="1.0"
script="plugin.gd"
enabled_by_default=true
; Imported car paints use the Car Paint Material node
depends=["car_paint>=1.0"]
