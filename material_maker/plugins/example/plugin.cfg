[plugin]

name="Example plugin"
description="Shows what plugins can add: a node (Example Stripes), a menu item, an import format (.stripes), an RPC method (example_node_count), a command line command (example_list_nodes), a command line mode (--example-thumbnails), a section of the 2D preview's export menu and an export hook. Disabled by default."
version="1.0"
script="plugin.gd"
nodes="nodes"
enabled_by_default=false
cli_modes=["--example-thumbnails"]
