[plugin]

name="Voxel master material"
description="Combines the voxel recipes of several graphs in one Unreal Engine 5 master material that selects the recipe of each object with an integer id: the --voxel-master command line mode (with --master-config). The Material Function export target is in the Voxel plugin."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--voxel-master"]
depends=["voxel"]
