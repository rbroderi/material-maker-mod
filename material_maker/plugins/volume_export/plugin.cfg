[plugin]

name="Volume export"
description="Exports 3D textures and 3D SDFs as volumes: OpenVDB (.vdb), 3D DDS (.dds) and KTX2 (.ktx2). Adds a Volume section to the export menu of the 2D preview (for 3D outputs), the --export-volume command line mode (with --voxels, --extent and --texel-format) and the export_volume RPC method. KTX2 files are written by the KTX2 format plugin."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--export-volume"]
depends=["ktx2_format"]
