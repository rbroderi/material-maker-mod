[plugin]

name="Car paint"
description="Adds the Car Paint Material node, that renders measured car paints (X-Rite's AxF CarPaint2 model: clear coat, color shift with the viewing angle, and flakes) in the 3D preview, and exports them to Godot 4. The AxF import plugin creates them."
version="1.0"
nodes="nodes"
enabled_by_default=true
