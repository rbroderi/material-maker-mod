[plugin]

name="Voxel material mesh bake"
description="Bakes a voxel material to the 2D textures of a mesh: the --bake-voxel-material command line mode (--mesh, --size, --unit-scale, --format png|exr, --set) and the bake_voxel_material RPC method write the base color, ORM, object space normal, emission and opacity maps in the mesh's UV layout. The position and normal maps of the mesh are baked, then the Voxel Material is evaluated at each texel."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--bake-voxel-material"]
depends=["voxel", "voxel_eval"]
