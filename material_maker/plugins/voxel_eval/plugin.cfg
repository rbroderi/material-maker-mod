[plugin]

name="Voxel point evaluation"
description="Evaluates node outputs (by default the outputs of the Voxel Material) at arbitrary points, with per point normals and fresh values: the --evaluate-points command line mode and the evaluate_points RPC method exchange NumPy .npy files with Python (see python/material_maker_client/voxel.py)."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--evaluate-points"]
depends=["voxel"]
