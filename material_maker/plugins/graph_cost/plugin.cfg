[plugin]

name="Graph cost"
description="A static, relative estimate of the cost of the shader code of a node or material (weighted operators, builtin functions and texture lookups, loops multiplied by their trip count), with a lint for code that is not GLSL/HLSL parity safe. Adds Plugins > Show shader cost, the --graph-cost command line mode and the graph_cost RPC method. The numbers are not Unreal's instruction counts."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--graph-cost"]
