[plugin]

name="Runtime export"
description="Exports materials as runtime packages (.mmr), that the Material Maker runtimes (Godot, C++/Vulkan, Blender, Unreal, Unity) render with parameters changed at runtime. Adds File/Export runtime package (.mmr)..., the --export-mmr command line mode and the export_mmr RPC method."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--export-mmr"]
