[plugin]

name="Runtime export"
description="Exports materials as runtime packages (.mmr): the compute shaders that render the material's textures, with the parameters that can be changed at runtime, so engines can render them again with other values. Adds File/Export runtime package (.mmr)..., the --export-mmr command line mode and the export_mmr RPC method."
version="1.0"
script="plugin.gd"
enabled_by_default=true
cli_modes=["--export-mmr"]
