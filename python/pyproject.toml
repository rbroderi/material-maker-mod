[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "material-maker-client"
version = "0.1.0"
description = "Client for the Material Maker JSON-RPC server, and mm-cook"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
mm-cook = "mm_cook:main"

[tool.setuptools]
packages = ["material_maker_client"]
py-modules = ["mm_cook"]
