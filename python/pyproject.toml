[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "material-maker-client"
version = "0.1.0"
description = "Client for the Material Maker JSON-RPC server"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["material_maker_client"]
